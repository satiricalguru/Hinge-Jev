<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme-color" name="theme-color" content="#edf2f7" />
    <meta
      name="description"
      content="Hinge turns Jev probabilities into inspectable decisions. Explore possible worlds, price mistakes, and ask the question that changes the outcome."
    />
    <title>Hinge — Every decision has a turning point.</title>
    <script>
      try {
        const saved = localStorage.getItem("hinge-theme");
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector("#theme-color")
          ?.setAttribute("content", theme === "dark" ? "#06101d" : "#edf2f7");
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/hinge.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
